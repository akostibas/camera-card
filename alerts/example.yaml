# Example alert settings for one household. Copy it, describe your own cameras, and keep your copy
# out of this repo. test_message.py checks the wording rules against this file.

# How sure the model must be (0 to 1) before something is said.
thresholds:
  sure: 0.5         # who, how many, that there is an animal, that a door is open
  maybe: 0.3        # an animal's kind, said as "maybe a rat"
  act_sure: 0.6     # an activity; a weaker yes is said as "maybe", and only if nothing is sure
  sex_sure: 0.7     # "a man" / "a woman"; below this it stays "an adult"
  car_sure: 0.6     # which car, and that it is coming or going; below this "a car may be"
  false_alarm: 0.8  # that nobody is there, said as "looks like a false alarm"

# The most paid descriptions in one day, all cameras together. Once it is used up, alerts go out in
# plain wording until tomorrow, and the first one refused says so.
daily_limit: 500

# Per camera:
#   scene          one-line description of the view, sent with the pictures
#   actions_list   ask who is there and what they are doing. Entries must read after "is", in the
#                  order they would happen; the last is the generic fallback
#   max_actions    how many activities one alert may report (default 2)
#   action_min     {activity: confidence} for activities that need more than a bare yes
#   animals_list   ask whether there is an animal and what kind
#   vehicles_list  ask whether a vehicle is moving and what kind (parked ones are ignored)
#   vehicle_actions_list   ask what that vehicle is doing. Same rules as actions_list
#   car_names      ask whether a car drove in or out, and name it by shade: {dark: ..., light: ...}
#   door_check     ask whether the garage door was left open
#   fallback       what to say when the model can't be asked (default "<what the camera detected> detected")
#   describe       which events get described: push (default: only what is sent to the phone), event
#                  (also every person, vehicle, animal or doorbell detection that is not pushed), or
#                  motion (also motion the camera recognised nothing in). Each one costs a model call
#
# One camera can have two entries, e.g. a doorbell that alerts when rung and also watches the street.
cameras:
  doorbell:
    scene: Doorbell camera looking out from the front door.
    actions_list:
      - delivering a package
      - here for maintenance or repair work
      - leaving
      - waiting at the door
    max_actions: 1  # the doorbell sends one still picture: a second activity is a second guess, not a second event
    action_min: {delivering a package: 0.8}
    fallback: Someone is at the door

  garage:
    scene: >-
      Security camera on the back wall of a garage, looking out through the garage door at the
      driveway and the street. Cars on the street are not in the garage or driveway: ignore them.
    actions_list:
      - opening the garage door
      - walking in
      - getting into a car
      - walking out
      - closing the garage door
      - near the garage
    animals_list: [rat, mouse, cat, dog, raccoon, other]
    car_names: {dark: wagon, light: hatchback}
    door_check: true

  side_yard:
    scene: Security camera looking down a side yard, with a shed on the left and a gate at the far end.
    actions_list:
      - arriving through the gate
      - walking from the house
      - coming out of the shed
      - going into the shed
      - leaving through the gate
      - standing or working in the yard

  street:
    scene: >-
      Camera by a front door, looking across the front yard at the street. The near curb is on
      this side of the street and the far curb is across it. Vehicles are usually parked at both.
    describe: event
    actions_list:
      - getting out of a car
      - walking a dog
      - smoking
      - getting into a car
      - walking by
    action_min: {smoking: 0.8}  # a small detail at this distance
    vehicles_list: [car, pickup truck, van, motorcycle, bicycle, trash truck]
    vehicle_actions_list:
      - parking at the near curb
      - parking at the far curb
      - collecting the trash
      - pulling away from the near curb
      - pulling away from the far curb
      - passing by

  crawl_space:
    scene: Security camera in a dark crawl space under a house, often in infrared black and white.
    actions_list: [working on equipment or wiring, looking around, in the crawl space]
    animals_list: [rat, mouse, cat, opossum, other]
