# Describes the format for available reolink services

ptz_move:
  target:
    entity:
      integration: reolink
      domain: button
      supported_features:
        - camera.CameraEntityFeature.STREAM
  fields:
    speed:
      required: true
      default: 10
      selector:
        number:
          min: 1
          max: 64
          step: 1

play_chime:
  fields:
    device_id:
      required: true
      selector:
        device:
          multiple: true
          filter:
            integration: reolink
            model: "Reolink Chime"
    ringtone:
      required: true
      selector:
        select:
          translation_key: ringtone
          options:
            - citybird
            - originaltune
            - pianokey
            - loop
            - attraction
            - hophop
            - goodday
            - operetta
            - moonlight
            - waybackhome

snapshot_past:
  target:
    entity:
      integration: reolink
      domain: camera
  fields:
    timestamp:
      required: true
      example: "2025-09-29 14:30:00"
      selector:
        datetime:
    filename:
      required: true
      example: "/tmp/reolink_snapshot.jpg"
      selector:
        text:

save_keyframes:
  fields:
    channel:
      required: true
      selector:
        number:
          min: 0
          max: 7
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
    width:
      default: 1280
      selector:
        number:
          min: 320
          max: 3840
    focus:
      selector:
        entity:
          domain: binary_sensor
    pictures:
      default: 16
      selector:
        number:
          min: 1
          max: 75

keep_description:
  fields:
    channel:
      required: true
      selector:
        number:
          min: 0
          max: 7
    time:
      required: true
      selector:
        datetime:
    text:
      required: true
      selector:
        text:

tuning_verdict:
  fields:
    channel:
      required: true
      selector:
        number:
          min: 0
          max: 7
    trigger:
      required: true
      selector:
        text:
    person:
      selector:
        text:
    vehicle:
      selector:
        text:
    animal:
      selector:
        text:
